name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Prepare assets
        run: |
          cp dist/luna-ocr dist/luna-ocr-linux-x64
          cd dist
          sha256sum luna-ocr-linux-x64 > luna-ocr-linux-x64.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/luna-ocr-linux-x64 dist/luna-ocr-linux-x64.sha256 assets/luna-ocr-logo.png --verify-tag --generate-notes
